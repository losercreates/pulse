{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pulse.fullname" . }}-gateway-pdb
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  minAvailable: {{ .Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" (dict "context" . "component" "gateway") | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pulse.fullname" . }}-processor-pdb
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
spec:
  minAvailable: {{ .Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" (dict "context" . "component" "processor") | nindent 6 }}
{{- end }}
