apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse.fullname" . }}-gateway
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" (dict "context" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pulse.selectorLabels" (dict "context" . "component" "gateway") | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Values.global.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy | default .Values.global.imagePullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HTTP_PORT
              value: {{ .Values.gateway.service.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.gateway.service.grpcPort | quote }}
            - name: REDPANDA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulse.fullname" . }}-config
                  key: PULSE_KAFKA_BROKERS
            - name: TOPIC_RAW
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pulse.fullname" . }}-config
                  key: PULSE_TOPIC_RAW
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.gateway.service.grpcPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
