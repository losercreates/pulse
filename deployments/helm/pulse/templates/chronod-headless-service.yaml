{{- if .Values.chronod.persistence.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.fullname" . }}-chronod-headless
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: chronod
spec:
  clusterIP: None
  selector:
    {{- include "pulse.selectorLabels" (dict "context" . "component" "chronod") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.chronod.service.httpPort }}
      targetPort: {{ .Values.chronod.service.httpPort }}
    - name: grpc
      port: {{ .Values.chronod.service.grpcPort }}
      targetPort: {{ .Values.chronod.service.grpcPort }}
{{- end }}
