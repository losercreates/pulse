apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.fullname" . }}-chronod
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: chronod
spec:
  type: {{ .Values.chronod.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.chronod.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.chronod.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "pulse.selectorLabels" (dict "context" . "component" "chronod") | nindent 4 }}
