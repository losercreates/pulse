apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.fullname" . }}-gateway
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.gateway.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "pulse.selectorLabels" (dict "context" . "component" "gateway") | nindent 4 }}
