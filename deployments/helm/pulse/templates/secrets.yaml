apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.fullname" . }}-security-secrets
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ .Values.security.secrets.tls.caCert | default "" | quote }}
  server.crt: {{ .Values.security.secrets.tls.serverCert | default "" | quote }}
  server.key: {{ .Values.security.secrets.tls.serverKey | default "" | quote }}
  device_keys.json: {{ .Values.security.secrets.apiKeys.deviceKeys | default "{}" | quote }}
  jwt_secret.key: {{ .Values.security.secrets.jwt.secret | default "" | quote }}
  hmac_signing_secret: {{ .Values.security.secrets.webhook.hmacSecret | default "" | quote }}

