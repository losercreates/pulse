# Default values for pulse Helm chart.
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: "docker.io/losercreates"
  imagePullPolicy: "IfNotPresent"
  tag: "1.0.0"
  redpanda:
    brokers: "pulse-redpanda:9092"
    topics:
      raw: "telemetry.raw"
      aggregates: "telemetry.aggregates"
      late: "telemetry.late"
      alerts: "telemetry.alerts"
      deadletter: "telemetry.alerts.deadletter"

gateway:
  replicaCount: 2
  image:
    repository: "pulse-gateway"
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 50051
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  terminationGracePeriodSeconds: 30

processor:
  replicaCount: 2
  image:
    repository: "pulse-processor"
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    httpPort: 8081
  consumerGroup: "pulse-stream-processor"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 12  # Capped strictly at 12 partitions per Constitution Principle I
    targetCPUUtilizationPercentage: 75
  terminationGracePeriodSeconds: 30

alertd:
  replicaCount: 1
  image:
    repository: "pulse-alertd"
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    httpPort: 8083
  consumerGroup: "pulse-alert-dispatcher"
  webhookURL: "http://host.docker.internal:8083/api/v1/alerts/webhook"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  terminationGracePeriodSeconds: 30

chronod:
  replicaCount: 1
  image:
    repository: "pulse-chronod"
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    httpPort: 8084
    grpcPort: 50054
  consumerGroup: "pulse-chronodb-consumer"
  shardCount: 16
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /var/lib/pulse/chronodb
    retentionDays: 14
    compactionInterval: 5m
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  terminationGracePeriodSeconds: 30

pdb:
  enabled: true
  minAvailable: 1

simulator:
  enabled: false
  image:
    repository: "pulse-simulator"
    tag: ""
    pullPolicy: ""
  targetRate: 25000
  devices: 500
  duration: "30s"
  profile: "mixed"
  transport: "grpc"
  workers: 4

# Milestone 009: Security & Access Control
security:
  networkPolicies:
    enabled: true
  secrets:
    tls:
      caCert: ""
      serverCert: ""
      serverKey: ""
    apiKeys:
      deviceKeys: "{}"
    jwt:
      secret: ""
      issuer: "pulse-auth"
      audience: "pulse-chronodb"
    webhook:
      hmacSecret: ""
