services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pulse-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"
      - "9644:9644"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pulse-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "echo 'Creating telemetry topics with 12 partitions...' &&
       rpk topic create telemetry.raw -p 12 -r 1 --brokers redpanda:29092 || true &&
       rpk topic create telemetry.aggregates -p 12 -r 1 --brokers redpanda:29092 || true &&
       rpk topic create telemetry.late -p 12 -r 1 --brokers redpanda:29092 || true &&
       rpk topic create telemetry.alerts -p 12 -r 1 --brokers redpanda:29092 || true &&
       rpk topic create telemetry.alerts.deadletter -p 12 -r 1 --brokers redpanda:29092 || true &&
       echo 'Topic provisioning complete:' &&
       rpk topic list --brokers redpanda:29092"
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: pulse-redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8088:8080"
    environment:
      KAFKA_BROKERS: "redpanda:29092"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pulse-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning/:ro
      - ./grafana/dashboards/:/etc/grafana/dashboards/:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pulse-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
