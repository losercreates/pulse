services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pulse-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"
      - "9644:9644"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pulse-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "echo 'Creating telemetry topics with 12 partitions...' &&
       rpk topic create telemetry.raw -p 12 -r 1 --brokers redpanda:29092 || true &&
       rpk topic create telemetry.aggregates -p 12 -r 1 --brokers redpanda:29092 || true &&
       rpk topic create telemetry.late -p 12 -r 1 --brokers redpanda:29092 || true &&
       echo 'Topic provisioning complete:' &&
       rpk topic list --brokers redpanda:29092"
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: pulse-redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8088:8080"
    environment:
      KAFKA_BROKERS: "redpanda:29092"
