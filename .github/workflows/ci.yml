name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Protoc Compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc Go Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Verify Protobuf Drift
        run: |
          make proto
          if ! git diff -I '^//.*protoc' --quiet proto/; then
            echo "Error: Generated protobuf code in proto/ is out of date with telemetry.proto!"
            echo "Run 'make proto' locally and commit the generated changes."
            git diff -I '^//.*protoc' proto/
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Tests with Race Detector & Coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Ingestion Benchmark
        run: go test -v -bench=. -benchtime=1s -benchmem ./tests/bench/...

      - name: Build Microservice Binaries
        run: make build

  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Go Module Hashes
        run: go mod verify

      - name: Run Go Vulnerability Scanner (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  observability:
    name: Observability & Dashboard Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Observability Stack & Dashboard Schemas
        run: |
          chmod +x ./scripts/verify_observability.sh
          ./scripts/verify_observability.sh

  packaging-k8s:
    name: Container Packaging & Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Helm Lint & Template Dry-Run
        run: |
          helm lint deployments/helm/pulse
          helm template pulse deployments/helm/pulse --dry-run

      - name: Build All Distroless Docker Images
        run: make docker-build

      - name: Run Packaging Verification Harness
        run: |
          chmod +x ./scripts/verify_packaging.sh
          ./scripts/verify_packaging.sh

  e2e-pipeline:
    name: Full Multi-Service Pipeline E2E Test
    runs-on: ubuntu-latest
    needs: [test, packaging-k8s]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Protoc Compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc Go Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Run End-to-End Multi-Service Pipeline Test
        run: |
          chmod +x ./scripts/e2e_pipeline.sh
          ./scripts/e2e_pipeline.sh

      - name: Stop Redpanda Cluster
        if: always()
        run: |
          docker compose -f deployments/docker-compose.yml down -v
